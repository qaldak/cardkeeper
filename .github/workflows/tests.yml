name: Tests

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  app:
    name: Lint, type check and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cardkeeper
          POSTGRES_PASSWORD: cardkeeper
          POSTGRES_DB: cardkeeper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cardkeeper -d cardkeeper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Integration tests truncate every table, so they only ever use this dedicated database.
      TEST_DATABASE_URL: postgresql://cardkeeper:cardkeeper@localhost:5432/cardkeeper_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    name: Compose file validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate production and development stacks
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile test config --quiet
