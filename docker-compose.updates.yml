# Optional labels for tools that watch for new versions. Not used by default. To switch them on, add this to your .env:
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.updates.yml
#
# (On Windows the separator is ";".) Nothing in this file has to be edited: the version that is followed is chosen with
# APP_IMAGE in .env, e.g. ghcr.io/qaldak/cardkeeper:0.24 (patch updates) or :0 (every update of the major version);
# the tags X.Y and X move with each release, X.Y.Z does not.
services:
  app:
    labels:
      # Watchtower, started with --label-enable (WATCHTOWER_LABEL_ENABLE=true): updates this container within its tag.
      # Note that the app applies new database migrations at every start, take a backup first (see README).
      com.centurylinklabs.watchtower.enable: "true"
      # Diun, with watchByDefault switched off: reports new versions of the image. By default only new major versions
      # (1.0.0 and up); DIUN_INCLUDE_TAGS in .env replaces the filter, e.g. for every release
      # DIUN_INCLUDE_TAGS='^[0-9]+\.[0-9]+\.[0-9]+$' (in single quotes). Inside this file a "$" is written "$$".
      diun.enable: "true"
      diun.watch_repo: "true"
      diun.sort_tags: semver
      diun.include_tags: ${DIUN_INCLUDE_TAGS:-^[1-9][0-9]*\.[0-9]+\.[0-9]+$$}
  db:
    labels:
      # PostgreSQL stays as it is, also with Watchtower in its default mode (all containers).
      com.centurylinklabs.watchtower.enable: "false"
