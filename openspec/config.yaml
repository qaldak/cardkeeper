schema: spec-driven

# Projektkontext. Jede Angabe ist belegt; Quellen stehen in Klammern.
context: |
  Projekt: CardKeeper, selbst gehostete Sammlung für Yu-Gi-Oh!- und Pokémon-Karten (README §Intro).

  Stack (README §Architecture, docs/adr/):
  - Nuxt 4 (TypeScript, Vue 3, Nitro) als eine Codebasis für Oberfläche und API, Nuxt UI + Tailwind CSS
  - Prisma 7 mit PostgreSQL 16, Vitest, Node 24 (Alpine), Docker Compose (Dienste `db` und `app`)
  - Kartendaten: YGOPRODeck (Yu-Gi-Oh!), TCGdex (Pokémon), je ein Adapter hinter einer Registry

  Prinzipien (README, docs/adr/):
  - Ein neues Spiel braucht keine Schemaänderung: spielspezifische Werte stehen als JSONB (ADR 0004, 0005).
  - Namen, Texte und Attribute der Karten sind schreibgeschützt; editierbar sind nur Set-Code und Edition bzw. Variante (README §Data model).
  - Nur der Besitzer ändert eine Karte; alle angemeldeten Benutzer sehen alle Karten (ADR 0008).
  - Preise bleiben in der Währung ihres Marktplatzes; die Umrechnung geschieht erst bei der Anzeige (ADR 0012).
  - Konfiguration über Umgebungsvariablen in `.env`, nicht über die Oberfläche (Chat 2026-10-10, siehe Spec `betrieb`).
  - Neue Einstellungen sind optional mit Standardwert und abschaltbar (Spec `entwicklung-release`).
  - Jede Oberflächen-Zeichenkette steht in `app/i18n/locales/de.json` und `en.json` (Spec `oberflaeche`).

  Konventionen:
  - Code-Kommentare und README auf Englisch (ADR 0024); Specs, ADRs und Migrationsdokumente auf Deutsch.
  - Commits nach Conventional Commits; der Pull-Request-Titel bestimmt bei Squash-Merge die Version; Major-Version nur bei ausdrücklichem Breaking Change (ADR 0015).
  - Sprechende Branch-Namen; Rückfragen vor der Ausführung (Spec `entwicklung-release`).
  - Tests: Unit-Tests für reine Logik, Integrationstests gegen eine echte PostgreSQL über `TEST_DATABASE_URL` (README §Tests).

  Dokumentation der Entscheide und ihrer Herkunft:
  - Überblick (C4: Kontext, Container, Bausteine, Abläufe): docs/ARCHITECTURE.md
  - Arbeitsregeln für Claude Code (Spec und Code deckungsgleich halten): CLAUDE.md
  - Architekturentscheide: docs/adr/ (ADR 0001–0024)
  - Anforderungen: openspec/specs/<domain>/spec.md; jede Anforderung nennt Quelle, Herkunft und Inventar-ID
  - Inventar, Verlauf geänderter Anforderungen und Konflikte der Baseline (Archiv, nicht mehr gepflegt): docs/spec-migration/

rules:
  specs:
    - "Anforderungen mit MUSS/SOLL formulieren und Szenarien als GIVEN/WHEN/THEN."
    - "Jede Anforderung enthält eine Zeile `Quelle: … | Herkunft: User-Vorgabe|Abgeleitet|Unklar | Inventar: … | MUSS=SHALL`; nichts ohne Quelle erfinden."
    - "Anforderungstext inklusive Quelle-Zeile höchstens 500 Zeichen (Grenze des OpenSpec-Validators)."
